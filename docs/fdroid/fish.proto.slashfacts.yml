MaintainerNotes: |-
  android/ is generated by `expo prebuild` at build time, so checkupdates reads the
  version from apps/mobile/app.json via UpdateCheckData. Expo modules build from source
  (autolinking buildFromSource); hermesc and the gradle files declaring node_modules
  maven repos are scanignored, the rest of the flagged node_modules is scandeleted.
  The JDK toolchain and JVM targets move to 21, the buildserver's JDK; reanimated and
  worklets hardcode Kotlin 17, hence their own sed. Per-ABI APKs: versionCode is
  1000 * upstream + 1/2/3 for armeabi-v7a/arm64-v8a/x86_64.

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[\d.]+$
VercodeOperation:
  - 1000 * %c + 1
  - 1000 * %c + 2
  - 1000 * %c + 3
UpdateCheckData: apps/mobile/app.json|"versionCode":\s*(\d+)|.|"version":\s*"([^"]+)"
