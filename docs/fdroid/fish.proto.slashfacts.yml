# Draft recipe for gitlab.com/fdroid/fdroiddata → metadata/fish.proto.slashfacts.yml
Categories:
  - Science & Education
License: GPL-3.0-only
AuthorName: PROTO/fish
AuthorEmail: contact@proto.fish
AuthorWebSite: https://proto.fish
WebSite: https://slashfacts.proto.fish
SourceCode: https://github.com/PROTO-fish/slashfacts
IssueTracker: https://github.com/PROTO-fish/slashfacts/issues
Changelog: https://github.com/PROTO-fish/slashfacts/releases

AutoName: SlashFacts

RepoType: git
Repo: https://github.com/PROTO-fish/slashfacts.git

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    subdir: apps/mobile
    sudo:
      - apt-get update
      - apt-get install -y xz-utils
      - curl -Lo node.tar.xz https://nodejs.org/dist/v22.20.0/node-v22.20.0-linux-x64.tar.xz
      - echo "00bbd05e306ea68b6e13e17360d0e2f680b493ef95f2fea1c4296ff7437530bc node.tar.xz"
        | sha256sum -c -
      - tar xJf node.tar.xz --strip-components=1 -C /usr/local
    init: cd ../.. && npm ci
    output: android/app/build/outputs/apk/release/app-release-unsigned.apk
    prebuild:
      - sed -i -e '1a "expo":{"autolinking":{"android":{"buildFromSource":[".*"]}}},'
        package.json
      - sed -i '/jvmToolchain\|JavaVersion/s/17/21/' ../../node_modules/@react-native/gradle-plugin/*/build.gradle.kts
        ../../node_modules/@react-native/gradle-plugin/react-native-gradle-plugin/src/main/kotlin/com/facebook/react/utils/JdkConfiguratorUtils.kt
      - sed -i 's/fromTarget("17")/fromTarget("21")/' node_modules/react-native-reanimated/android/build.gradle.kts
        node_modules/react-native-worklets/android/build.gradle.kts
      - EXPO_NO_TELEMETRY=1 npx expo prebuild -p android --no-install --clean
      - sed -i -e '/signingConfig /d' android/app/build.gradle
      - printf '\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=2g\n' >> android/gradle.properties
    scanignore:
      - node_modules/hermes-compiler/hermesc/linux64-bin/hermesc
      - apps/mobile/node_modules/react-native/ReactAndroid/publish.gradle
      - apps/mobile/node_modules/expo/node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - apps/mobile/node_modules/react-native-safe-area-context/android/build.gradle
      - apps/mobile/node_modules/react-native-svg/android/build.gradle
    scandelete:
      - node_modules
      - apps/mobile/node_modules
    build: cd android && gradle assembleRelease
    ndk: 27.1.12297006

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[\d.]+$
UpdateCheckData: apps/mobile/app.json|"versionCode":\s*(\d+)|.|"version":\s*"([^"]+)"
CurrentVersion: 1.0.0
CurrentVersionCode: 1
