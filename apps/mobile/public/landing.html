<style>
@font-face{font-family:Archivo;src:url(/fonts/archivo-black.woff2) format("woff2");font-weight:900;font-display:swap}
:root{--ink:#000;--paper:#fff;--b:3px}
*{box-sizing:border-box;margin:0}
html{background:var(--paper);color:var(--ink);-webkit-text-size-adjust:100%}
body{font:900 1rem/1.35 Archivo,"Arial Black",system-ui,sans-serif;padding:clamp(12px,2.5vw,24px);padding-bottom:max(clamp(12px,2.5vw,24px),env(safe-area-inset-bottom))}
a{color:inherit;text-decoration:none}
:focus-visible{outline:var(--b) solid var(--ink);outline-offset:-9px}

/* One sheet, ruled like the pad: the gaps are the rules. */
.sheet{display:grid;gap:var(--b);background:var(--ink);border:var(--b) solid var(--ink);
  min-height:calc(100svh - 2*clamp(12px,2.5vw,24px));
  grid-template-areas:"mark" "head" "links" "why" "foot";grid-template-rows:auto 1fr auto auto auto;max-width:1280px;margin:0 auto}
.sheet>*{background:var(--paper)}
.mark{grid-area:mark;padding:14px 20px;font-size:clamp(1.6rem,4vw,2.6rem);line-height:1;letter-spacing:-.02em}
.head{grid-area:head;display:flex;align-items:flex-end;padding:56px 20px 24px}
h1{font-size:clamp(3rem,13.5vw,8.5rem);line-height:.86;letter-spacing:-.045em}
.links{grid-area:links;display:grid;align-content:end;background:var(--paper)}
.row+.row{border-top:var(--b) solid var(--ink)}
/* The 2–9 table, ruled like the sheet. Pressing a product sends a diagonal wave of ink out
   from it; hovering one lights it with its two factors. */
.table{display:none;grid-template-columns:repeat(var(--n),1fr);grid-template-rows:repeat(var(--n),1fr);--n:8;gap:var(--b);background:var(--ink);min-height:0;container-type:size;cursor:default;user-select:none;-webkit-user-select:none}
.table span{display:flex;align-items:center;justify-content:center;background:var(--paper);font-size:min(5cqw,6cqh);line-height:1}
.table[data-heads=on]{--n:9}
.table .x{background:#ececec}
/* The factors: grey, so they read as labels, not results. Hovering a product
   blacks out its two factors and greys its row and column. */
.table .h{color:#8a8a8a}
.table .h.on{background:var(--ink);color:var(--paper)}
.table .on{background:var(--ink);color:var(--paper)}
/* The wave leaves a short wake of greys behind it, darkest nearest the front. */
.table .g1{background:#4a4a4a;color:var(--paper)}
.table .g2{background:#9a9a9a;color:var(--ink)}
.table .g3{background:#dedede;color:var(--ink)}
.table i{font-style:normal;display:block;transition:transform 130ms ease-out}
/* A lens rides the wave: numbers just ahead of it shrink a touch, the front swells and tips
   off its square, each by its own angle, and the step behind is still a little large. */
.table .pre i{transform:scale(.86)}
.table .w i{transform:scale(1.24) rotate(var(--tilt))}
.table .g1 i{transform:scale(1.08)}
.row{display:flex;align-items:center;gap:14px;padding:0 20px;height:58px;background:var(--paper);font-size:.82rem;letter-spacing:.1em;text-transform:uppercase}
.row span{flex:1;text-wrap:balance}
.row b{font-weight:inherit}
.row.main{height:auto;min-height:96px;background:var(--ink);color:var(--paper);font-size:clamp(1.15rem,2.4vw,1.5rem);letter-spacing:.08em}
.row:hover{background:var(--ink);color:var(--paper)}
.row.main:hover{background:var(--paper);color:var(--ink)}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.brand{fill:currentColor;stroke:none;width:20px;height:20px}
.main .i{width:28px;height:28px}
.go{transition:transform .12s steps(2)}
.row:hover .go{transform:translate(3px,-3px)}
.why{grid-area:why;padding:16px 20px;font-size:.9rem;display:flex;align-items:center}
.foot{grid-area:foot;padding:16px 20px;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase}
.foot a{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}

@media (min-width:860px){
  .sheet{grid-template-columns:minmax(0,1fr) 380px;grid-template-areas:"mark mark" "head links" "why foot";grid-template-rows:auto 1fr auto}
  .head{padding:48px 40px}
  .mark,.why,.foot{padding-left:40px;padding-right:40px}
  .foot{padding-left:20px;padding-right:20px;justify-content:space-between;gap:6px 10px;letter-spacing:.06em;flex-wrap:nowrap;white-space:nowrap}
  /* Tiles keep their size; the room left above them holds the whole game, the 2–9 table. */
  .links{grid-template-rows:minmax(0,1fr);grid-auto-rows:auto}
  .table{display:grid}
  .row{height:72px;padding:0 24px}
  .row.main{height:clamp(160px,26vh,240px);display:grid;grid-template-columns:1fr auto;grid-template-rows:auto 1fr;align-items:start;padding:24px;font-size:2.2rem;line-height:.95;letter-spacing:-.01em}
  .row.main span{grid-column:1/-1;grid-row:2;align-self:end}
  .row.main b{display:block}
  .row.main .go{grid-column:2;grid-row:1;width:32px;height:32px}
  .row.main .i:first-child{grid-row:1}
  h1{font-size:clamp(4.5rem,8.4vw,9rem)}
}
@media (prefers-reduced-motion:reduce){.go{transition:none}.table i,.table .w i,.table .pre i,.table .g1 i{transition:none;transform:none}}

<script>
(() => {
  const table = document.getElementById('table');
  const N = 8, HEADS = table.dataset.heads === 'on', cells = [], heads = { r: [], c: [] };
  const add = (text, cls) => {
    const el = document.createElement('span'), i = document.createElement('i');
    i.textContent = text; el.append(i); if (cls) el.className = cls;
    el.style.setProperty('--tilt', (Math.random() * 18 - 9).toFixed(1) + 'deg');
    table.append(el); return el;
  };
  if (HEADS) {
    add('×', 'h');
    for (let c = 0; c < N; c++) heads.c.push(add(c + 2, 'h'));
  }
  for (let r = 0; r < N; r++) {
    if (HEADS) heads.r.push(add(r + 2, 'h'));
    for (let c = 0; c < N; c++) {
      const el = add((r + 2) * (c + 2));
      el.dataset.r = r; el.dataset.c = c;
      cells.push(el);
    }
  }
  // A press sends a wave out from that cell: the cells at one Manhattan distance light at each
  // step, diagonal rings switched on and off like the keys in the app, with a short wake of
  // greys. Nothing moves until someone presses, and the timer runs only while a wave does.
  const STEP = 110;
  const dist = (el, o) => Math.round(Math.abs(el.dataset.r - o[0]) + Math.abs(el.dataset.c - o[1]));
  const reach = (o) => Math.max(...cells.map((el) => dist(el, o)));
  let waves = [], hover = null, running = false;
  function paint(now) {
    const rings = waves.map((w) => [w.o, Math.floor((now - w.t0) / STEP)]);
    for (const el of cells) {
      // How many steps ago the nearest wave front crossed this cell: 0 is the front itself.
      let behind = 9, ahead = false;
      for (const [o, ring] of rings) {
        const k = ring - dist(el, o);
        if (k >= 0 && k < behind) behind = k;
        if (k === -1) ahead = true;
      }
      const hit = behind === 0;
      el.classList.toggle('w', hit);
      el.classList.toggle('pre', ahead && behind > 1);
      el.classList.toggle('on', hit || el === hover);
      for (let g = 1; g <= 3; g++) el.classList.toggle('g' + g, behind === g && el !== hover);
      // The hovered product's row and column, leading back to its two factors.
      el.classList.toggle('x', !!hover && el !== hover && (el.dataset.r === hover.dataset.r || el.dataset.c === hover.dataset.c));
    }
    heads.r.forEach((h, i) => h.classList.toggle('on', !!hover && +hover.dataset.r === i));
    heads.c.forEach((h, i) => h.classList.toggle('on', !!hover && +hover.dataset.c === i));
  }
  function tick() {
    const now = performance.now();
    waves = waves.filter((w) => now < w.end);
    paint(now);
    if (waves.length) setTimeout(tick, STEP / 2);
    else running = false;
  }
  table.addEventListener('pointerover', (e) => { const el = e.target.closest('span'); hover = el && el.dataset.r ? el : null; paint(performance.now()); });
  table.addEventListener('pointerleave', () => { hover = null; paint(performance.now()); });
  // On press, not on release: the wave leaves as the finger lands, like a key.
  table.addEventListener('pointerdown', (e) => {
    const el = e.target.closest('span');
    if (!el || !el.dataset.r) return;
    const o = [+el.dataset.r, +el.dataset.c], now = performance.now();
    waves.push({ o, t0: now, end: now + (reach(o) + 4) * STEP });
    if (!running) { running = true; tick(); }
  });
})();
</script>
<script>
// The big tile is the way in for this device: App Store on an iPhone or iPad, Google Play on
// Android, the web anywhere else, worded as each store's own badge. Read from the browser,
// sent nowhere; without JavaScript the web stays first. ?as=ios|android forces it.
(() => {
  const ua = navigator.userAgent, as = new URLSearchParams(location.search).get('as');
  const ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  const p = as || (ios ? 'ios' : /Android/.test(ua) ? 'android' : 'web');
  const tile = document.querySelector('[data-p="' + p + '"][data-main]');
  if (!tile) return;
  const web = document.querySelector('[data-p="web"]'), nav = web.parentNode;
  web.classList.remove('main'); web.querySelector('span').innerHTML = 'Play on the web';
  tile.classList.add('main'); tile.querySelector('span').innerHTML = tile.dataset.main;
  nav.insertBefore(tile, web);
})();
</script>
